name: Auto Update JTVP Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Clean, and Verify Playlist
        env:
          JTVP_API_ENDPOINT: ${{ secrets.JTVP_API_ENDPOINT }}
        run: |
          echo "[+] Downloading playlist from endpoint..."
          
          HTTP_STATUS=$(curl -o temp_raw.m3u -w "%{http_code}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --location \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Accept: */*" \
            "$JTVP_API_ENDPOINT")

          echo "Response HTTP Status: $HTTP_STATUS"

          # Verify valid download
          if [ "$HTTP_STATUS" -ne 200 ] || ! grep -q "#EXTM3U" temp_raw.m3u; then
            echo "[-] Error: Failed to fetch valid playlist."
            exit 1
          fi

          echo "[+] Removing unwanted watermarks and comments..."
          # Filter out specific unwanted words and author tags
          grep -v -E "𝗟ɪᴛᴛʟᴇ 𝗖ᴏᴅʀ|ZioSt|Fu£ked" temp_raw.m3u > Zio.m3u
          
          # Clean up temporary file
          rm -f temp_raw.m3u

          echo "[✓] Cleaned Zio.m3u successfully."

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Zio.m3u
          
          if git diff --staged --quiet; then
            echo "No updates detected in playlist. Skipping commit."
          else
            git commit -m "Auto-clean and update Zio.m3u [skip ci]"
            git push origin main
          fi
