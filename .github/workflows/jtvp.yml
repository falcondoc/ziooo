name: Auto Update JTVP Playlist

on:
  schedule:
    # Runs automatically every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      # Auto-triggers immediately when you save from your web UI
      - 'blocked.json'
      - '.github/workflows/jtvp.yml'
      - 'filter_playlist.py'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Raw Playlist
        env:
          JTVP_API_ENDPOINT: ${{ secrets.JTVP_API_ENDPOINT }}
        run: |
          echo "[+] Downloading source playlist..."
          HTTP_STATUS=$(curl -o temp_raw.m3u -w "%{http_code}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --location \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Accept: */*" \
            "$JTVP_API_ENDPOINT")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] || ! grep -q "#EXTM3U" temp_raw.m3u; then
            echo "[-] Error: Failed to fetch valid playlist from endpoint."
            exit 1
          fi

      - name: Filter & Clean Playlist
        run: |
          echo "[+] Running filter_playlist.py with blocked.json..."
          python filter_playlist.py
          rm -f temp_raw.m3u

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Zio.m3u
          
          if git diff --staged --quiet; then
            echo "[i] No changes detected in playlist. Skipping commit."
          else
            git commit -m "Auto-filter and update Zio.m3u [skip ci]"
            git push origin main
            echo "[✓] Successfully updated Zio.m3u."
          fi
